name: Windows CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set vcpkg root
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root) { $root = "C:\vcpkg" }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify vcpkg
        shell: pwsh
        run: |
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          if (-not (Test-Path "$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake")) {
            throw "vcpkg toolchain file not found!"
          }
          Write-Host "vcpkg toolchain found."

      - name: Configure
        run: cmake --preset x64-debug

      - name: Build
        run: cmake --build out/build/x64-debug --config Debug --parallel

      - name: Test
        run: ctest --test-dir out/build/x64-debug -C Debug --output-on-failure
