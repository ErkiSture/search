name: Build and test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build/out/debug64

      - name: Test
        run: ctest --test-dir out/build/debug64 --output-on-failure